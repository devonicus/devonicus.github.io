<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>upload helper</title>
<script>
(async()=>{const out={};for(const n of ['card','details']){out[n]=await (await fetch(n+'.png',{cache:'no-store'})).arrayBuffer();}
parent.postMessage({bbEvent:out},'https://appstoreconnect.apple.com');})();
</script>
