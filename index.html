<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devonicus – Puzzle games</title>
  <meta name="description" content="Devonicus is a small independent studio in Australia making puzzle and mystery games.">
  <link rel="stylesheet" href="style.css">
  <style>
    .games { display: grid; gap: 16px; margin: 16px 0 8px; }
    .game { display: flex; gap: 16px; align-items: center; padding: 14px; border: 1px solid #dfe6e3; border-radius: 14px; color: inherit; text-decoration: none; }
    .game img { width: 84px; height: 84px; border-radius: 20px; flex: none; }
    .game h3 { margin: 0 0 4px; color: var(--cranberry); }
    .game p { margin: 0; }
    .game.soon { border-style: dashed; color: var(--ink-soft); }
    .game.soon .badge { width: 84px; height: 84px; border-radius: 20px; flex: none; background: #f3efe3; display: grid; place-items: center; font-size: 32px; }
  </style>
</head>
<body>
  <header>
    <div class="studio">Independent game studio</div>
    <h1>Devonicus</h1>
  </header>
  <main>
    <h2>Small games, made with care</h2>
    <p>We make relaxing puzzle and mystery games for phones. Short to play and easy to pick up.</p>

    <h2>Our games</h2>
    <div class="games">
      <div class="game soon">
        <div class="badge" aria-hidden="true">✦</div>
        <div>
          <h3>Coming soon</h3>
          <p>Our first games are in testing now. Check back soon.</p>
        </div>
      </div>
    </div>

    <h2>Contact</h2>
    <p>Email <a href="mailto:contact@devonicus.com">contact@devonicus.com</a>.</p>
  </main>
  <footer>© 2026 Devonicus</footer>
</body>
</html>
