<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Store links only: this page sends phones to the right app store. No game build here (see READ-FIRST.md). -->
  <meta name="robots" content="noindex">
  <title>Get Shelf Life</title>
  <meta property="og:title" content="Shelf Life: Shop Sort Puzzle">
  <meta property="og:description" content="Sort the stock, sell the shelves and survive the week. A corner-shop puzzle with relics that change the rules.">
  <meta property="og:image" content="https://devonicus.com/img/shelf-life.webp">
  <link rel="stylesheet" href="../../style.css">
  <style>
    .get { text-align: center; padding: 24px 0; }
    .get img { width: 112px; height: 112px; border-radius: 26px; }
    .get .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
    .get .links a { padding: 12px 18px; border-radius: 999px; background: var(--brass); color: var(--ink); font-weight: 700; text-decoration: none; }
  </style>
  <script>
    // straight to the store on a phone; desktops see the buttons.
    // Shelf Life is live on Google Play (production since 20 Nov 2026).
    var ANDROID_LIVE = true;
    (function () {
      var ua = navigator.userAgent || "";
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (ios) location.replace("https://apps.apple.com/app/id6833218090");
      else if (ANDROID_LIVE && /Android/.test(ua)) location.replace("https://play.google.com/store/apps/details?id=com.devonicus.shelflife");
    })();
  </script>
</head>
<body>
  <header>
    <div class="studio">Independent game studio</div>
    <h1>Devonicus</h1>
  </header>
  <main class="get">
    <img src="../../img/shelf-life.webp" alt="" width="112" height="112">
    <h2>Shelf Life</h2>
    <p>Sort the stock, sell the shelves and survive the week.</p>
    <div class="links">
      <a href="https://apps.apple.com/app/id6833218090">App Store</a>
      <a id="play" href="https://play.google.com/store/apps/details?id=com.devonicus.shelflife" hidden>Google Play</a>
    </div>
    <p id="soon">On Android? Shelf Life is in a closed beta: email <a href="mailto:contact@devonicus.com?subject=Shelf%20Life%20Android%20beta">contact@devonicus.com</a> to join.</p>
    <script>
      if (ANDROID_LIVE) { document.getElementById("play").hidden = false; document.getElementById("soon").hidden = true; }
    </script>
  </main>
  <footer>© 2026 Devonicus</footer>
</body>
</html>
