<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Store links only: this page sends phones to the right app store. No game build here (see READ-FIRST.md). -->
  <meta name="robots" content="noindex">
  <title>Get Word Duel Rivals</title>
  <meta property="og:title" content="Word Duel Rivals">
  <meta property="og:description" content="Three seven-letter racks, ninety seconds, one rival. A daily word puzzle and 1v1 word duels.">
  <meta property="og:image" content="https://devonicus.com/img/word-duel-rivals.webp">
  <link rel="icon" href="/img/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/brand/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#23262B">
  <link rel="stylesheet" href="../../style.css">
  <style>
    .get { text-align: center; padding: 24px 0; }
    .get img { width: 112px; height: 112px; border-radius: 26px; }
    .get .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
    .get .links a { padding: 12px 18px; border-radius: 999px; background: var(--brass); color: var(--ink); font-weight: 700; text-decoration: none; }
  </style>
  <script src="/go/count.js"></script>
  <script>
    // straight to the store on a phone; desktops see the buttons.
    (function () {
      var ua = navigator.userAgent || "";
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (ios) dvGo("https://apps.apple.com/app/id6834963628");
      else if (/Android/.test(ua)) dvGo("https://play.google.com/store/apps/details?id=com.devonicus.wordduelrivals");
    })();
  </script>
</head>
<body>
  <header>
    <div class="studio">Independent game studio</div>
    <h1>Devonicus</h1>
  </header>
  <main class="get">
    <img src="../../img/word-duel-rivals.webp" alt="" width="112" height="112">
    <h2>Word Duel Rivals</h2>
    <p>Three racks, ninety seconds, one rival. Can you beat my words?</p>
    <div class="links">
      <a href="https://apps.apple.com/app/id6834963628">App Store</a>
      <a href="https://play.google.com/store/apps/details?id=com.devonicus.wordduelrivals">Google Play</a>
    </div>
  </main>
  <footer>© 2026 Devonicus</footer>
</body>
</html>
