<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Store links only: this page sends phones to the right app store. No game build here (see READ-FIRST.md). -->
  <meta name="robots" content="noindex">
  <title>Get Biscuit's Bookshop Mysteries</title>
  <meta property="og:title" content="Biscuit's Bookshop Mysteries">
  <meta property="og:description" content="Fill the shelves, find the clues and help a bookshop cat solve seaside mysteries. A new mystery every week.">
  <meta property="og:image" content="https://devonicus.com/img/biscuits-bookshop-mysteries.webp">
  <link rel="icon" href="/img/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/img/brand/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#23262B">
  <link rel="stylesheet" href="../../style.css">
  <style>
    .get { text-align: center; padding: 24px 0; }
    .get img { width: 112px; height: 112px; border-radius: 26px; }
    .get .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
    .get .links a { padding: 12px 18px; border-radius: 999px; background: var(--brass); color: var(--ink); font-weight: 700; text-decoration: none; }
  </style>
  <script>
    // straight to the store on a phone; desktops see the buttons.
    // Live on Google Play; not on the App Store yet (set IOS_LIVE = true once it is).
    var IOS_LIVE = false;
    (function () {
      var ua = navigator.userAgent || "";
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      if (ios && IOS_LIVE) location.replace("https://apps.apple.com/app/id6830298397");
      else if (/Android/.test(ua)) location.replace("https://play.google.com/store/apps/details?id=com.devonicus.biscuitbookshop");
    })();
  </script>
</head>
<body>
  <header>
    <div class="studio">Independent game studio</div>
    <h1>Devonicus</h1>
  </header>
  <main class="get">
    <img src="../../img/biscuits-bookshop-mysteries.webp" alt="" width="112" height="112">
    <h2>Biscuit's Bookshop Mysteries</h2>
    <p>Fill the shelves, find the clues and help a bookshop cat solve seaside mysteries.</p>
    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.devonicus.biscuitbookshop">Google Play</a>
      <a id="as" href="https://apps.apple.com/app/id6830298397" hidden>App Store</a>
    </div>
    <p id="soon">Coming soon to the App Store.</p>
    <script>
      if (IOS_LIVE) { document.getElementById("as").hidden = false; document.getElementById("soon").hidden = true; }
    </script>
  </main>
  <footer>© 2026 Devonicus</footer>
</body>
</html>
